# Render Infrastructure as Code (Blueprint)
# Standalone Next.js Frontend Deployment on Render Free Tier

services:
  # ----------------------------------------------------
  # StockSense Next.js Web Frontend Service
  # ----------------------------------------------------
  - type: web
    name: stocksense-web
    runtime: node
    plan: free
    region: singapore # Options: oregon, frankfurt, singapore, ohio
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
